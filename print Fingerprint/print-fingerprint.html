<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FBI Fingerprint Scanner - Memory Protocol</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="terminal-header">
        <div class="status-bar">
          <span class="status-text">FBI BIOMETRIC SYSTEM v2.4</span>
          <span class="timestamp" id="timestamp"></span>
        </div>
      </div>

      <div class="main-content">
        <div class="info-panel">
          <h1 class="title">FINGERPRINT AUTHENTICATION</h1>
          <div class="security-level">
            <span>SECURITY CLEARANCE:</span>
            <span class="level" id="level">LEVEL 1</span>
          </div>
          <div class="attempts">
            <span>ATTEMPTS REMAINING:</span>
            <span class="attempts-count" id="attempts">3</span>
          </div>
          <div class="sequence-info">
            <span>SEQUENCE LENGTH:</span>
            <span class="sequence-length" id="sequenceLength">3</span>
          </div>
          <div class="timer-info">
            <span>TIME REMAINING:</span>
            <span class="timer-count" id="timer">30</span>
          </div>
        </div>

        <div class="scanner-container">
          <div class="fingerprint" id="fingerprint">
            <div class="fp-node" data-node="0"></div>
            <div class="fp-node" data-node="1"></div>
            <div class="fp-node" data-node="2"></div>
            <div class="fp-node" data-node="3"></div>
            <div class="fp-node" data-node="4"></div>
            <div class="fp-node" data-node="5"></div>
            <div class="fp-node" data-node="6"></div>
            <div class="fp-node" data-node="7"></div>
            <div class="fp-node" data-node="8"></div>
          </div>
          <div class="scan-line" id="scanLine"></div>
        </div>

        <div class="control-panel">
          <button class="btn btn-start" id="startBtn">INITIATE SCAN</button>
          <div class="status-message" id="statusMessage">AWAITING INPUT...</div>
        </div>

        <div class="result-panel" id="resultPanel">
          <div class="result-content">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-text" id="resultText"></div>
            <button class="btn btn-continue" id="continueBtn">CONTINUE</button>
          </div>
        </div>
      </div>

      <div class="terminal-footer">
        <div class="footer-text">CLASSIFIED - AUTHORIZED PERSONNEL ONLY</div>
      </div>
    </div>
