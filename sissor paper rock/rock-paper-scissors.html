<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Rock • Paper • Scissors</h1>

    <section class="scoreboard">
      <div class="score">You: <span id="playerScore">0</span></div>
      <div class="score">Bot: <span id="botScore">0</span></div>
    </section>

    <section class="choices">
      <button class="choice" data-move="rock" aria-label="Rock">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="34" r="16" fill="#cbd5e1" />
            <path d="M20 36c6 6 28 6 32-4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Rock</span>
      </button>
      <button class="choice" data-move="paper" aria-label="Paper">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="14" y="10" width="36" height="44" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
            <line x1="20" y1="22" x2="44" y2="22" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="20" y1="30" x2="44" y2="30" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Paper</span>
      </button>
      <button class="choice" data-move="scissors" aria-label="Scissors">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
            <circle cx="44" cy="44" r="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
            <path d="M26 26 L38 38" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
            <path d="M38 26 L26 38" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Scissors</span>
      </button>
    </section>

    <section class="result">
      <div id="message">Make your move!</div>
      <div class="hands">
        <div class="hand">You: <span id="playerMove">—</span></div>
        <div class="hand">Bot: <span id="botMove">—</span></div>
      </div>
    </section>

    <section class="controls">
      <button id="reset">Reset Scores</button>
      <label class="toggle">
        <input type="checkbox" id="soundToggle" checked>
        <span>Sound</span>
      </label>
    </section>

    <footer>
      <small>Built By Aaditya</small>
    </footer>
  </main>

  <script src="js/app.js"></script>
  <audio id="botAudio" preload="auto">
    <source src="audio/reveal.mp3" type="audio/mpeg">
  </audio>
</body>
</html>
